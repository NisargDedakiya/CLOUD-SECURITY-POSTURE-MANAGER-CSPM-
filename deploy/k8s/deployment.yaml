apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-cnapp-backend
  namespace: aegis-security
  labels:
    app.kubernetes.io/name: aegis-cnapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegis-cnapp
  template:
    metadata:
      labels:
        app: aegis-cnapp
    spec:
      containers:
        - name: aegis-api
          image: aegis-cnapp/backend:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: CSPM_AUTH_MODE
              value: "headers"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: aegis-secrets
                  key: database-url
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/cspm/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/cspm/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-cnapp-service
  namespace: aegis-security
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: aegis-cnapp
