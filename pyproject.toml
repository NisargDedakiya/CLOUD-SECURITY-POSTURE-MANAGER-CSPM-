[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspm"
version = "0.2.0"
description = "Tool 6 — Cloud Security Posture Manager (AWS/GCP/Azure) for the Track 2 platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "deepdiff>=6.0",
    "celery>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
gcp = ["google-auth>=2.0", "google-cloud-storage>=2.0"]
azure = ["azure-identity>=1.15", "azure-mgmt-resource>=23.0"]

[project.scripts]
cspm = "cspm.cli:main"

[tool.setuptools.packages.find]
include = ["cspm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
