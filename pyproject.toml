[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspm"
version = "0.1.0"
description = "Multi-cloud Cloud Security Posture Manager (AWS, GCP, Azure)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cspm = "cspm.cli:main"

[tool.setuptools.packages.find]
include = ["cspm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
