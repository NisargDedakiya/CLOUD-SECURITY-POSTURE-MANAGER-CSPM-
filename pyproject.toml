[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cspm"
version = "0.5.0"
description = "Tool 6 — Cloud Security Posture Manager (AWS/GCP/Azure) for the Track 2 platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "cryptography>=42.0",
    "deepdiff>=6.0",
    "celery>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
    "pyjwt[crypto]>=2.8",
    "requests>=2.31",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.4", "moto>=5.0", "pytest-cov>=5.0"]
deploy = ["alembic>=1.13", "psycopg[binary]>=3.1"]
billing = ["stripe>=9.0"]
observability = ["sentry-sdk>=2.0", "opentelemetry-instrumentation-fastapi>=0.46b0"]
gcp = [
    "google-auth>=2.0",
    "google-cloud-storage>=2.0",
    "google-api-python-client>=2.100",
]
azure = [
    "azure-identity>=1.15",
    "azure-mgmt-storage>=21.0",
    "azure-mgmt-network>=25.0",
    "azure-mgmt-sql>=3.0",
    "azure-mgmt-compute>=30.0",
]

[project.scripts]
cspm = "cspm.cli:main"

[tool.setuptools.packages.find]
include = ["cspm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # str+Enum is intentional for JSON/pydantic serialization
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
"alembic/*" = ["E402", "F401"]
