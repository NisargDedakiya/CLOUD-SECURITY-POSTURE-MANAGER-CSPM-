<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSPM — Cloud Security Posture Manager</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <!-- Login screen -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <div class="brand"><span class="logo">🛡️</span> <span>CSPM</span></div>
      <p class="tagline">Cloud Security Posture Manager</p>

      <div class="seg">
        <button class="seg-btn active" data-mode="headers">Dev / Org</button>
        <button class="seg-btn" data-mode="token">Token</button>
        <button class="seg-btn" data-mode="apikey">API Key</button>
      </div>

      <form id="login-form">
        <div data-for="headers">
          <label>Organisation ID</label>
          <input id="in-org" placeholder="demo-org" value="demo-org" />
          <label>Role</label>
          <select id="in-role">
            <option value="admin">admin</option>
            <option value="analyst">analyst</option>
            <option value="viewer">viewer</option>
          </select>
        </div>
        <div data-for="token" class="hidden">
          <label>Bearer token (JWT)</label>
          <input id="in-token" placeholder="eyJhbGci..." />
        </div>
        <div data-for="apikey" class="hidden">
          <label>API key</label>
          <input id="in-apikey" placeholder="cspm_..." />
        </div>
        <button type="submit" class="btn primary full">Sign in</button>
        <p class="hint">Backend running with <code>CSPM_AUTH_MODE=headers</code> accepts Org/Role directly.</p>
      </form>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><span class="logo">🛡️</span> <span>CSPM</span></div>
      <nav id="nav">
        <a href="#/overview" data-view="overview"><span>📊</span> Overview</a>
        <a href="#/accounts" data-view="accounts"><span>🔌</span> Cloud Accounts</a>
        <a href="#/findings" data-view="findings"><span>🔎</span> Findings</a>
        <a href="#/compliance" data-view="compliance"><span>📋</span> Compliance</a>
        <a href="#/drift" data-view="drift"><span>🌊</span> Drift</a>
        <a href="#/apikeys" data-view="apikeys"><span>🔑</span> API Keys</a>
      </nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="btn ghost sm">🌓 Theme</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div id="crumb" class="crumb">Overview</div>
        <div class="top-actions">
          <span id="org-badge" class="badge"></span>
          <button id="refresh" class="btn ghost sm">↻ Refresh</button>
          <button id="logout" class="btn ghost sm">Sign out</button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>
  <div id="modal-root"></div>

  <script src="/static/app.js"></script>
</body>
</html>
